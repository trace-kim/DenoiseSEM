# Plain DDIM (Song, Meng & Ermon) training recipe for SEM images read from a
# folder: the LSUN 256 px recipe (bedroom.yml) carried to 512 px grayscale.
#
#   CUDA_VISIBLE_DEVICES=0 python -m ddim.main --config sem_ddim_512.yml --exp experiments/sem512 --doc run1 --ni
#
# Every image in data_path (any size, e.g. 1024x1024) is resized to
# image_size x image_size before it reaches the model.
data:
    dataset: "SEM"
    data_path: "/data/sem/images"      # folder of raw images; edit this
    image_size: 512
    channels: 1
    logit_transform: false
    uniform_dequantization: false
    gaussian_dequantization: false
    random_flip: false
    rescaled: true
    num_workers: 0
    cache_in_memory: true              # decoded once, ~1 MiB RAM per image at 512 px
    recursive: false
    validation_split: 0.1
    split_seed: 2019
    extensions: [".png", ".tif", ".tiff", ".jpg", ".jpeg"]

model:
    type: "simple"
    in_channels: 1
    out_ch: 1
    ch: 128
    ch_mult: [1, 1, 2, 2, 4, 4]        # 512 -> 16 px bottleneck, so attention sits at 16 as in the paper
    num_res_blocks: 2
    attn_resolutions: [16, ]
    dropout: 0.0
    var_type: fixedlarge
    ema_rate: 0.9999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

training:
    batch_size: 8
    n_epochs: 10000
    n_iters: 200000                    # optimizer-step budget; the runner stops here, not at n_epochs
    snapshot_freq: 10000               # ckpt_<step>.pth + ckpt.pth, ~1.8 GB each (model + Adam + EMA)
    validation_freq: 2000

sampling:
    batch_size: 8
    last_only: True

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.00002                        # the authors' 256 px value; 0.0002 is their 64 px value
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    grad_clip: 1.0
