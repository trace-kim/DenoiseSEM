# All statistics retain exported pixel units (DN). No intensity normalization.
expected_frames: 128
min_frames: 8
# Crop out labels/scale bars BEFORE registration: [y0, y1, x0, x1], stops exclusive.
roi: null
frame_interval_s: null
pixel_size_nm: null
# Set actual detector/export clipping bounds if known, e.g. 0 and 4095 for
# unscaled 12-bit values in a 16-bit PNG. Otherwise integer dtype limits apply.
# Pixels at these bounds are masked out of the registration fit.
black_level: null
white_level: null
# affine: ECC geometry, then separate two-region target-to-input brightness.
# Raw inputs stay untouched. See pairs/ and target_pairs.csv in each site.
# fit: legacy joint eight-parameter estimator. none: frames taken as aligned.
registration: affine
registration_sigma: 1.0
# Optional independent direct-versus-composed ECC audit: none | sampled | all.
compare_direct_registration: none
sample_pixels: 8192
distribution_samples: 100000
intensity_bins: 12
flat_fraction: 0.5
max_lag: 32
spatial_pairs: 16
spatial_max_side: 512
seed: 17
