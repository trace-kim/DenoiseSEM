# All statistics retain exported pixel units (DN). No intensity normalization.
expected_frames: 128
min_frames: 8
# Crop out labels/scale bars BEFORE registration: [y0, y1, x0, x1], stops exclusive.
roi: null
frame_interval_s: null
pixel_size_nm: null
# Set actual detector/export clipping bounds if known, e.g. 0 and 4095 for
# unscaled 12-bit values in a 16-bit PNG. Otherwise integer dtype limits apply.
black_level: null
white_level: null
registration: translation
max_shift_px: 12.0
upsample_factor: 20
registration_sigma: 1.0
registration_max_side: 768
min_correlation: 0.2
local_grid: 3
local_frames: 16
# Optional feature affine diagnostics/difference images. For all frames and
# more tiles, use affine_diagnostics.yml or CLI --local-frames 0 --local-grid 5.
affine_diagnostics: false
affine_min_improvement_px: 0.05
affine_min_relative_improvement: 0.15
affine_max_cv_error_px: 0.5
affine_max_stability_px: 0.25
affine_min_texture_ratio: 0.02
feature_max_keypoints: 1500
feature_match_ratio: 0.75
feature_residual_px: 1.5
feature_min_inliers: 8
feature_min_inlier_fraction: 0.5
feature_min_overlap: 0.5
diff_examples: 3
sample_pixels: 8192
distribution_samples: 100000
intensity_bins: 12
flat_fraction: 0.5
max_lag: 32
spatial_pairs: 16
spatial_max_side: 512
seed: 17
