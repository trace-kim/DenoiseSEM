<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1700" height="620" viewBox="0 0 1700 620" font-family="Segoe UI, Arial, Helvetica, sans-serif"><title>Registration flow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475664"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="30" y="44" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" fill="#1C2530" font-weight="bold" text-anchor="start">Registration from noisy frames: what fails, what works</text><text x="30" y="76" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#475664" font-weight="normal" text-anchor="start">The objection: registration correction may be needed and may not be available on a noisy input.  Measured on 276 bursts with recorded drift.</text><rect x="30" y="110" width="520" height="230" rx="10" fill="#F6E3E0" stroke="#C0392B" stroke-width="2"/><text x="50" y="142" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#C0392B" font-weight="bold" text-anchor="start">global cross-correlation peak (stock estimator)</text><text x="50" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">periodic line patterns: the noisy correlation locks onto</text><text x="50" y="196.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">a neighbouring period -&gt; errors of 5-15 px; soft edges:</text><text x="50" y="218.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">a broad peak -&gt; 0.3-0.5 px even when it locks correctly.</text><text x="50" y="239.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">200 held-out bursts: rms 0.60 / 3.26 px (dy / dx),</text><text x="50" y="261.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">80 % of frames off by more than a quarter pixel.</text><rect x="580" y="110" width="520" height="230" rx="10" fill="#F4ECDD" stroke="#A2711C" stroke-width="2"/><text x="600" y="142" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#A2711C" font-weight="bold" text-anchor="start">bounded search + Gauss-Newton, raw frames</text><text x="600" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">search only within 6 px of the previous frame: no period</text><text x="600" y="196.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">aliasing.  Least squares on 2-px-smoothed frames:</text><text x="600" y="218.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">0.02-0.04 px wherever the image has gradients -- BUT a</text><text x="600" y="239.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">field of horizontal lines constrains x only through noise</text><text x="600" y="261.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">-&gt; 1-3 px along the lines (24 of 96 scenes).  Held-out:</text><text x="600" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">rms 0.07 / 0.88 px, 22 % of frames &gt; 0.25 px.</text><rect x="1130" y="110" width="540" height="230" rx="10" fill="#E4F1E8" stroke="#2E7D4F" stroke-width="2"/><text x="1150" y="142" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#2E7D4F" font-weight="bold" text-anchor="start">the same, on denoised frames (deployed)</text><text x="1150" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">each frame first through the single-frame denoiser</text><text x="1150" y="196.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">(the m = 1 level of the fusion network itself), then</text><text x="1150" y="218.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">the same bounded least-squares fit.  Held-out:</text><text x="1150" y="239.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">rms 0.04 / 0.13 px, worst frame 0.9 px, 6.8 % of</text><text x="1150" y="261.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">frames &gt; 0.25 px; the fused image is within 0.05 dB</text><text x="1150" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">of what the recorded drift gives.</text><image x="60" y="370" width="110" height="110" href="data:image/png;base64," style="image-rendering:pixelated"/><rect x="60" y="370" width="110" height="110" fill="none" stroke="#8A96A3" stroke-width="1.5"/><text x="115.0" y="504" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1C2530" font-weight="normal" text-anchor="middle">raw frame</text><text x="115.0" y="526" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="16" fill="#475664" font-weight="normal" text-anchor="middle">peak 10</text><line x1="180" y1="425" x2="290" y2="425" stroke="#475664" stroke-width="2.5" marker-end="url(#arrow)"/><text x="235" y="410" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#475664" font-weight="normal" text-anchor="middle">denoise (t = 1)</text><image x="300" y="370" width="110" height="110" href="data:image/png;base64," style="image-rendering:pixelated"/><rect x="300" y="370" width="110" height="110" fill="none" stroke="#8A96A3" stroke-width="1.5"/><text x="355.0" y="504" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1C2530" font-weight="normal" text-anchor="middle">denoised</text><text x="355.0" y="526" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="16" fill="#475664" font-weight="normal" text-anchor="middle">registered on this</text><line x1="420" y1="425" x2="490" y2="425" stroke="#475664" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#475664" font-weight="normal" text-anchor="middle">fit</text><text x="500" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">trajectory: mid-frame position per frame + drift velocity</text><text x="500" y="421.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">(intra-frame shear) from a constant-velocity smoother;</text><text x="500" y="443.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">every frame is then resampled once into frame 0's coordinates.</text><text x="30" y="560.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">Bootstrap: the denoiser used for registration is trained on pairs registered from raw frames (their residual errors sit along directions that barely move the loss),</text><text x="30" y="581.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#475664" font-weight="normal" text-anchor="start">so the pipeline needs nothing but the raw bursts.  The report measures both registrations against the generator's recorded drift.</text></svg>