# BURST FUSION under drift (edge_denoise/fusion.py, docs/burst_fusion_report.md).
#
# One network for every dose: the mean of a REGISTERED subset of m raw frames
# of a drifting burst goes in with t = m, and the loss compares the prediction
# -- warped into the coordinates of ONE other raw frame of the same burst by
# the registration's residual shift -- with that raw frame.  No clean image,
# no averaged target, no pre-registered data: the dataset is the drifting
# acquisition (data/MIIC-burst-p10-drift, `python -m edge_denoise
# generate-drift`) and the registration table is estimated from the noisy
# frames alone (`python -m edge_denoise register`).
#
# Warm start from the N2N teacher (t = 1 is exactly what it was trained with),
# sobloss objective (image + 4x Sobel), 30k steps at batch 8 over the levels
# below, so m = 1 is the single-frame estimator and m = 15 the burst one.
#
#   python -m edge_denoise register --dataset data/MIIC-burst-p10-drift --out runs/edge_denoise/registration_drift_raw.json
#   python -m edge_denoise train --config edge_denoise/configs/miic_p10_drift_fuse.yml
data:
  dataset_dir: data/MIIC-burst-p10-drift
  image_size: 64
  channels: 1
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 2019
objective:
  representation: image
  target: noisy
  gradient_target: target
  lambda_image: 1.0
  lambda_gradient: 4.0
  lambda_consistency: 0.0
  loss: l2
  fusion:
    frames_per_burst: 16
    levels: [1, 2, 3, 4, 6, 8, 12, 15]
    align: truth

    condition_on_level: true
    warp_margin: 2
model:
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/miic_p10_drift_fuse_truth
  init_checkpoint: runs/edge_denoise/ft_ladder/teacher_n2n.pt
  batch_size: 8
  max_steps: 30000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: auto
  log_every: 50
  val_every: 1000
  val_images: 8
  checkpoint_every: 5000
