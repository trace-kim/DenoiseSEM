# BURST FUSION, multi-frame target (see miic_p10_drift_fuse.yml for the base
# recipe).  Same registered subset means with t = m; the loss reads up to
# four raw frames outside the subset, each through its own warp of the
# prediction, and averages them: the frame target's unbiasedness (no target
# is ever resampled) with a quarter of its gradient noise -- the remedy for
# the high-dose levels whose gradient a single raw target buries, without the
# interpolation blur the complement-mean target carries.  Warm start from the
# frame-target model.
#
#   python -m edge_denoise train --config edge_denoise/configs/miic_p10_drift_fuse_multi.yml
data:
  dataset_dir: data/MIIC-burst-p10-drift
  image_size: 64
  channels: 1
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 2019
objective:
  representation: image
  target: noisy
  gradient_target: target
  lambda_image: 1.0
  lambda_gradient: 4.0
  lambda_consistency: 0.0
  loss: l2
  fusion:
    frames_per_burst: 16
    levels: [1, 2, 3, 4, 6, 8, 12, 12, 12]
    target: multi_frame
    targets_per_sample: 4
    align: registered
    registration: runs/edge_denoise/registration_drift_pre.json
    condition_on_level: true
    warp_margin: 2
model:
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/miic_p10_drift_fuse_multi
  init_checkpoint: runs/edge_denoise/miic_p10_drift_fuse/ckpt_latest.pt
  batch_size: 8
  max_steps: 30000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: auto
  log_every: 50
  val_every: 1000
  val_images: 8
  checkpoint_every: 5000
