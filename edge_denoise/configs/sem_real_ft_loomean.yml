# ft_noisy with the leave-one-out mean target: each input frame's image/Sobel
# target is the mean of every OTHER acquisition of its site, each affine-
# registered and percentile-matched to the input. Inputs stay native.
# Identical to sem_real_ft_noisy.yml except objective.target and run_dir.
# Not the older sem_real_ft_avgfull*.yml recipes (translation-prepared data,
# no inline matching, different batching).
# Override paths through CLI flags; init_checkpoint must be the real N2N teacher.
data:
  dataset_dir: data/SEM-real-none
  image_size: 512
  channels: 1
  real_matching:
    registration: affine
    brightness: percentile
objective:
  representation: image
  target: noisy_mean
  gradient_target: target
  lambda_image: 1.0
  lambda_gradient: 4.0
  lambda_consistency: 0.0
  consistency_domain: image
  loss: l2
model:
  ch: 64
  ch_mult: [1, 1, 2, 2, 4, 4]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/sem_real_ft_loomean_affine_percentile
  init_checkpoint: runs/edge_denoise/sem_real_n2n/ckpt_latest.pt
  init_mode: strict
  batch_size: 4
  accumulation_steps: 4
  precision: fp32
  max_steps: 10000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: cuda:0
  log_every: 50
  val_every: 1000
  val_images: 4
  checkpoint_every: 1000
