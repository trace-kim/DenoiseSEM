# BURST FUSION, CLEAN-TARGET ORACLE (synthetic-land ceiling).  Identical to
# miic_p10_drift_fuse_cmean.yml except that the loss target is the clean
# scene in frame-0 coordinates: the best any unbiased target can do with this
# network, registration and dose ladder.  Never deployable; it prices the
# target noise of the two self-supervised variants.
#
#   python -m edge_denoise train --config edge_denoise/configs/miic_p10_drift_fuse_oracle.yml
data:
  dataset_dir: data/MIIC-burst-p10-drift
  image_size: 64
  channels: 1
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 2019
objective:
  representation: image
  target: noisy
  gradient_target: target
  lambda_image: 1.0
  lambda_gradient: 4.0
  lambda_consistency: 0.0
  loss: l2
  fusion:
    frames_per_burst: 16
    levels: [1, 2, 4, 6, 8, 12, 12, 12]
    target: clean
    level_cap: 12
    align: registered
    registration: runs/edge_denoise/registration_drift_pre.json
    condition_on_level: true
    warp_margin: 2
model:
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/miic_p10_drift_fuse_oracle
  init_checkpoint: runs/edge_denoise/miic_p10_drift_fuse/ckpt_latest.pt
  batch_size: 8
  max_steps: 40000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: auto
  log_every: 50
  val_every: 1000
  val_images: 8
  checkpoint_every: 5000
