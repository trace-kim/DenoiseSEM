# TARGET-LADDER ARM E (the dormant switch): arm A's objective plus the
# implemented-but-unexplored lambda_consistency term -- the only term that
# changes the OPTIMUM toward lower cross-acquisition variance (method doc §6)
# rather than reshaping error.  lambda_consistency 1.0 puts the penalty
# (~2 Var ~ 3e-4 at the teacher's pixel sigma) on the same footing as the
# reducible part of the fidelity error; the degenerate constant-output end of
# this dial is held off by the full fidelity objective.
# Identical to miic_p10_dedup_ft_noisy.yml except `lambda_consistency`.
#
#   python -m edge_denoise train --config edge_denoise/configs/miic_p10_dedup_ft_consist.yml
data:
  dataset_dir: data/MIIC-burst-p10-dedup
  image_size: 64
  channels: 1
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 2019
objective:
  representation: image
  target: noisy
  gradient_target: target
  lambda_image: 1.0
  lambda_gradient: 4.0
  lambda_consistency: 1.0
  loss: l2
model:
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/miic_p10_dedup_ft_consist
  init_checkpoint: runs/edge_denoise/ft_ladder/teacher_n2n.pt
  batch_size: 8
  max_steps: 10000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: auto
  log_every: 50
  val_every: 1000
  val_images: 8
  checkpoint_every: 5000
