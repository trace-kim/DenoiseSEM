# PILOT ARM B (the literal proposal): pure gradient representation. Input
# sobel(y), output a predicted Sobel field supervised by sobel(fresh frame)
# (gradient-domain Noise2Noise -- valid because Sobel is linear and keeps the
# target noise zero-mean); at inference the image is recovered by the exact
# FFT least-squares inverse with the DC offset taken from the noisy input's
# crop mean. Same capacity/data/split/recipe as the other arms.
#
#   python -m edge_denoise train --config edge_denoise/configs/miic_p10_dedup_grad.yml
#
# Expected training-loss floor: 0.154 * 12/64 ~ 0.029 (per-channel Sobel
# noise gain; loss is the channel mean).
data:
  dataset_dir: data/MIIC-burst-p10-dedup
  image_size: 64
  channels: 1
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 2019
objective:
  representation: gradient
  target: noisy
  lambda_image: 0.0
  lambda_gradient: 1.0
  lambda_consistency: 0.0
  loss: l2
model:
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/miic_p10_dedup_grad
  batch_size: 8
  max_steps: 30000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: auto
  log_every: 50
  val_every: 1000
  val_images: 8
  checkpoint_every: 2000
