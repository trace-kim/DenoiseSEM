# PILOT ARM C (ablation): plain image representation with the gradient loss
# ADDED -- isolates what the Sobel loss term contributes without the Sobel
# input channels (the hybrid arm changes both at once). Identical to plain
# N2N except lambda_gradient.
#
#   python -m edge_denoise train --config edge_denoise/configs/miic_p10_dedup_sobloss.yml
data:
  dataset_dir: data/MIIC-burst-p10-dedup
  image_size: 64
  channels: 1
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 2019
objective:
  representation: image
  target: noisy
  lambda_image: 1.0
  lambda_gradient: 4.0
  lambda_consistency: 0.0
  loss: l2
model:
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  resamp_with_conv: true
training:
  run_dir: runs/edge_denoise/miic_p10_dedup_sobloss
  batch_size: 8
  max_steps: 30000
  lr: 0.0002
  grad_clip: 1.0
  ema: true
  ema_rate: 0.999
  seed: 0
  device: auto
  log_every: 50
  val_every: 1000
  val_images: 8
  checkpoint_every: 2000
